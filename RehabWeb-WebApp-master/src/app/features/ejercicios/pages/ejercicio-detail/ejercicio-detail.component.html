<div class="detail-page animate-in">
  @if (cargando()) {
    <div class="detail-skeleton">
      <div class="detail-skeleton__media"></div>
      <div class="detail-skeleton__bar detail-skeleton__bar--lg"></div>
      <div class="detail-skeleton__bar"></div>
      <div class="detail-skeleton__bar"></div>
    </div>
  } @else if (ejercicio()) {
    <app-ejercicio-preview [ejercicio]="ejercicio()!" />
  } @else {
    <div class="detail-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <p>No se pudo cargar el ejercicio solicitado.</p>
      <a routerLink="/ejercicios" class="detail-error__link">Regresar a la biblioteca</a>
    </div>
  }
</div>
